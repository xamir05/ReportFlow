<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportFlow - Test Interface</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h2>ReportFlow Document Generator 🚀</h2>
    <button class="excel-button" onclick="descargar('excel')">Download Excel</button>
    <button class="pdf-button" onclick="descargar('pdf')">Download PDF</button>

    <script>
        async function descargar(tipo) {
            const data = {
                "formato": tipo,
                "titulo": "Monthly Financial Report",
                "mes": "September 2026",
                "datos": [
                    { "fecha": "01/09/2026", "concepto": "EcoFinx License Sale", "categoria": "Income", "monto": 45000 },
                    { "fecha": "05/09/2026", "concepto": "AWS Server Hosting", "categoria": "Expense", "monto": -3500 },
                    { "fecha": "12/09/2026", "concepto": "Maintenance", "categoria": "Expense", "monto": -1500 },
                    { "fecha": "15/09/2026", "concepto": "Consulting Services", "categoria": "Income", "monto": 12000 }
                ]
            };

            const response = await fetch('/api/generar-reporte', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = tipo === 'pdf' ? 'financial-report.pdf' : 'financial-report.xlsx';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                alert('Error generating the report.');
            }
        }
    </script>
</body>
</html>
