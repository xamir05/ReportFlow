<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report</title>
    <link rel="stylesheet" href="reportTemplate.css">
    <style>
        .total-amount {
            color: #004B87;
        }
    </style>
</head>
<body class="template-{{plantilla}}">
    <header>
        <div>
            <h1>{{titulo}}</h1>
            <div class="subtitle">{{periodo}}: {{mes}}</div>
        </div>
        <div>
            <strong>ReportFlow Inc.</strong>
        </div>
    </header>

    <table>
        <thead>
            <tr>
                <th>{{fecha}}</th>
                <th>{{concepto}}</th>
                <th>{{categoria}}</th>
                <th>{{monto}}</th>
            </tr>
        </thead>
        <tbody>
            {{filasTabla}}
        </tbody>
    </table>

    <div class="total-section">
        {{totalLabel}}: <span class="total-amount">{{totalNeto}}</span>
    </div>
</body>
</html>
