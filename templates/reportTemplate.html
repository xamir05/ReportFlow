<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report</title>
    <link rel="stylesheet" href="reportTemplate.css">
</head>
<body>
    <header>
        <div>
            <h1>{{titulo}}</h1>
            <div class="subtitle">Period: {{mes}}</div>
        </div>
        <div>
            <strong>ReportFlow Inc.</strong>
        </div>
    </header>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Concept</th>
                <th>Category</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            {{filasTabla}}
        </tbody>
    </table>

    <div class="total-section">
        Net Total: <span style="color: #004B87;">{{totalNeto}}</span>
    </div>
</body>
</html>
